<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Calendario de Tarefas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list *ngIf="tasksWithDate.length > 0; else emptyState">
    <ion-item *ngFor="let task of tasksWithDate">
      <ion-label>
        <h2>{{ task.title }}</h2>
        <p>Data prevista: {{ task.dueDate }}</p>
        <p>{{ task.done ? 'Concluida' : 'Pendente' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ng-template #emptyState>
    <div class="empty-state">
      <h3>Nenhuma tarefa com data</h3>
      <p>Defina prazos nas tarefas para visualizar o calendario.</p>
    </div>
  </ng-template>
</ion-content>
