<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Configuracoes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Preferencias do Usuario</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Nome exibido</ion-label>
        <ion-input [(ngModel)]="displayName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Exibir tarefas concluidas</ion-label>
        <ion-toggle [(ngModel)]="showCompleted"></ion-toggle>
      </ion-item>

      <ion-item>
        <ion-label>Tema escuro</ion-label>
        <ion-toggle [(ngModel)]="darkMode"></ion-toggle>
      </ion-item>

      <ion-button expand="block" (click)="savePreferences()">Salvar preferencias</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-button color="danger" expand="block" class="logout" (click)="logout()">
    Sair da sessao
  </ion-button>
</ion-content>
