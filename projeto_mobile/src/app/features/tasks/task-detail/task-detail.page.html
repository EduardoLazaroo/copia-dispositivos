<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/tasks"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalhes da Tarefa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Titulo</ion-label>
        <ion-input [(ngModel)]="title"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Descricao</ion-label>
        <ion-textarea [(ngModel)]="description"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Prioridade</ion-label>
        <ion-select [(ngModel)]="priority">
          <ion-select-option value="baixa">Baixa</ion-select-option>
          <ion-select-option value="media">Media</ion-select-option>
          <ion-select-option value="alta">Alta</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Prazo</ion-label>
        <ion-datetime presentation="date" [(ngModel)]="dueDate"></ion-datetime>
      </ion-item>

      <ion-button expand="block" color="success" (click)="save()">Salvar alteracoes</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
