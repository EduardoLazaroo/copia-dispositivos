<ion-content class="login-content" [fullscreen]="true">
  <div class="hero">
    <p class="hero-kicker">Projeto Master UNIVEM</p>
    <h1>Desenvolvimento de Aplicativos Moveis</h1>
    <p>Entre para acessar o app de referencia da disciplina e acompanhar a evolucao das 20 semanas.</p>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Acesso</ion-card-title>
      <ion-card-subtitle>Acesse ou crie sua conta para sincronizar suas tarefas.</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Usuario</ion-label>
        <ion-input [(ngModel)]="username" placeholder="Digite seu usuario"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input [(ngModel)]="password" type="password" placeholder="Digite sua senha"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="onLogin()" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </ion-button>
      <ion-button expand="block" fill="outline" (click)="onRegister()" [disabled]="loading">
        Criar conta
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
