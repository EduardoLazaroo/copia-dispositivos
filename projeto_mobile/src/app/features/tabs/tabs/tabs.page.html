<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tasks" [routerLink]="['/app/tasks']">
      <ion-icon name="checkmark-done-outline"></ion-icon>
      <ion-label>Tarefas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="calendar" [routerLink]="['/app/calendar']">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Calendario</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" [routerLink]="['/app/settings']">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Configuracoes</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
